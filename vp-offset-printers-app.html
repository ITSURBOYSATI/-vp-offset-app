<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VP Offset Printers — Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#0c2d68; --ink-soft:#123a82; --ink-soft2:#16428f;
    --paper:#f4f6fb; --paper-dim:#e8ecf6; --paper-card:#ffffff;
    --line:#dbe1ee; --line-dark:#1f4394;
    --cyan:#0385d6; --magenta:#980e19; --yellow:#f37e22; --green:#1a8a4c; --red:#c0392b;
    --text:#1a2233; --text-dim:#66708c; --text-inv:#eaf0fc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--paper);color:var(--text);font-family:'Poppins',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--yellow);color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  .sidebar{width:230px;flex-shrink:0;background:var(--ink);color:var(--text-inv);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:20px 20px 16px;border-bottom:1px solid var(--line-dark);}
  .brand h1{font-size:19px;font-weight:600;margin:0;line-height:1.2;letter-spacing:.2px;}
  .brand p{margin:4px 0 0;font-size:11.5px;color:#9fb0d9;font-style:italic;line-height:1.4;}
  nav{flex:1;padding:14px 10px;overflow-y:auto;}
  nav .navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7f92c2;padding:14px 12px 6px;}
  nav button{width:100%;text-align:left;background:none;border:none;color:#cbd6ef;padding:9px 12px;border-radius:6px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;margin-bottom:1px;}
  nav button .dot{width:6px;height:6px;border-radius:50%;background:#3d548f;flex-shrink:0;}
  nav button:hover{background:var(--ink-soft2);color:#fff;}
  nav button.active{background:var(--ink-soft2);color:#fff;font-weight:600;}
  nav button.active .dot{background:var(--yellow);}
  .sidebar-footer{padding:14px 20px;border-top:1px solid var(--line-dark);font-size:11px;color:#7f92c2;}

  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--paper-card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;gap:12px;}
  .topbar h2{font-size:22px;margin:0;font-weight:600;}
  .topbar .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .content{padding:26px 28px 60px;max-width:1280px;width:100%;}

  .btn{font-size:13px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--ink-soft2);}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-dark);}
  .btn.secondary:hover{background:var(--paper-dim);}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
  .kpi{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi:before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent,var(--cyan));}
  .kpi .label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
  .kpi .value{font-size:26px;font-weight:600;margin-top:6px;}
  .kpi .hint{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  .panel{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;}
  .panel h3{font-size:17px;margin:0 0 14px;font-weight:600;}
  .panel .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .panel .panel-head h3{margin:0;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);border-bottom:1px solid var(--line-dark);padding:8px 10px;font-weight:600;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-dim);}
  .num{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .empty-row td{text-align:center;color:var(--text-dim);padding:26px;font-style:italic;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px;}
  .badge.paid{background:#dcead2;color:#3d6b2e;}
  .badge.pending{background:#f0e4c8;color:#8a5a10;}
  .badge.low{background:#f3d9d4;color:#8c2f1f;}
  .badge.ok{background:#dcead2;color:#3d6b2e;}
  .badge.inactive{background:#e6e1d4;color:#5c5344;}

  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line-dark);border-radius:6px;background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  input:disabled{background:var(--paper-dim);color:var(--text-dim);}
  label{font-size:12px;font-weight:600;color:var(--text-dim);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:grid;gap:14px;}
  .row.c2{grid-template-columns:1fr 1fr;}
  .row.c3{grid-template-columns:1fr 1fr 1fr;}
  .row.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
  .row.c5{grid-template-columns:1fr 1fr 1fr 1fr 1fr;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,17,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
  .modal{background:var(--paper-card);border-radius:12px;max-width:760px;width:100%;padding:26px 28px;border:1px solid var(--line);}
  .modal h3{font-size:19px;margin:0 0 18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-dark);margin-bottom:20px;flex-wrap:wrap;}
  .tabs button{background:none;border:none;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tabs button.active{color:var(--text);border-bottom-color:var(--magenta);}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:slideup .25s ease;}
  @keyframes slideup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .stock-bar{height:6px;border-radius:4px;background:var(--paper-dim);overflow:hidden;margin-top:6px;}
  .stock-bar-fill{height:100%;background:var(--cyan);}
  .stock-bar-fill.low{background:var(--red);}

  .filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filter-bar input,.filter-bar select{width:auto;min-width:140px;}
  .helptext{font-size:11.5px;color:var(--text-dim);margin-top:4px;}
  .item-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:6px;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0;}
  .cal-wd{font-size:10px;text-transform:uppercase;color:var(--text-dim);text-align:center;font-weight:600;}
  .cal-cell{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;background:#fff;min-height:52px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;user-select:none;}
  .cal-cell .d{font-size:12px;font-weight:600;}
  .cal-cell .s{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:10px;}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.st-P{background:#dcead2;border-color:#b7d8a4;}
  .cal-cell.st-P .s{background:#3d6b2e;color:#fff;}
  .cal-cell.st-A{background:#f3d9d4;border-color:#e3b3a8;}
  .cal-cell.st-A .s{background:#8c2f1f;color:#fff;}
  .cal-cell.st-H{background:#f7ecc9;border-color:#e9d493;}
  .cal-cell.st-H .s{background:#8a5a10;color:#fff;}
  .cal-cell.st-L{background:#d7e6f7;border-color:#aecbee;}
  .cal-cell.st-L .s{background:#0e5a72;color:#fff;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-top:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .quickatt-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .qa-btns{display:flex;gap:6px;}
  .qa-btns button{padding:6px 10px;font-size:11px;font-weight:700;border-radius:6px;border:1px solid var(--line-dark);background:#fff;cursor:pointer;}
  .qa-btns button.on-P{background:#3d6b2e;color:#fff;border-color:#3d6b2e;}
  .qa-btns button.on-A{background:#8c2f1f;color:#fff;border-color:#8c2f1f;}
  .qa-btns button.on-H{background:#8a5a10;color:#fff;border-color:#8a5a10;}
  .qa-btns button.on-L{background:#0e5a72;color:#fff;border-color:#0e5a72;}

  .insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .insight:last-child{border-bottom:none;}
  .insight .ic{font-size:16px;}

  .mini-bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px;}
  .mini-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;}
  .mini-bars .bar{width:100%;background:var(--cyan);border-radius:4px 4px 0 0;min-height:2px;}
  .mini-bars .lbl{font-size:9.5px;color:var(--text-dim);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-dark);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 860px){
    #app{min-height:100dvh;}
    .sidebar{width:280px;left:-290px;box-shadow:8px 0 24px rgba(0,0,0,.22);position:fixed;top:0;bottom:0;height:100dvh;transition:left .2s;z-index:60;}
    .sidebar.open{left:0;}
    .brand{padding:18px 18px 14px;}
    nav{padding:10px 8px;}
    nav button{min-height:44px;padding:10px 12px;font-size:14px;}
    .topbar{position:sticky;top:0;padding:11px 12px;gap:10px;min-height:58px;align-items:center;}
    .topbar h2{font-size:18px;line-height:1.15;}
    .topbar .sub{font-size:11px;line-height:1.3;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .menu-btn{display:inline-flex !important;align-items:center;justify-content:center;flex:0 0 auto;width:42px;height:42px;padding:0;font-size:20px;}
    .content{padding:14px 12px 80px;max-width:none;}
    .panel{padding:14px;margin-bottom:14px;border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .kpi-grid{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
    .kpi{padding:12px 13px;border-radius:8px;}
    .kpi .value{font-size:21px;}
    .row.c2,.row.c3,.row.c4,.row.c5{grid-template-columns:1fr;}
    input,select,textarea{font-size:14px;min-height:42px;padding:9px 10px;}
    table{min-width:640px;font-size:12px;}
    th{font-size:9.5px;padding:8px;} td{padding:8px;}
    .tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px 16px;padding:0 14px;}
    .tabs::-webkit-scrollbar{display:none;}
    .tabs button{padding:10px 13px;min-height:42px;flex:0 0 auto;}
    .modal-backdrop{padding:10px;align-items:flex-end;}
    .modal{width:100%;max-width:none;max-height:92dvh;overflow-y:auto;border-radius:14px;padding:18px 15px 14px;-webkit-overflow-scrolling:touch;}
    .modal-actions{position:sticky;bottom:-14px;background:var(--paper-card);margin:14px -15px -14px;padding:12px 15px;flex-wrap:wrap;gap:8px;z-index:2;}
    .cal-grid{gap:4px;}
    .cal-cell{min-height:44px;padding:6px 2px;}
  }
  .menu-btn{display:none;background:none;border:1px solid var(--line-dark);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:16px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   DATA MODEL
============================================================ */
const STORE_KEYS = ['settings','employees','attendance','salaries','priceCalcs','inventory','stockTx','jobLogs'];
let DB = { settings:null, employees:[], attendance:[], salaries:[], priceCalcs:[], inventory:[], stockTx:[], jobLogs:[] };
let currentTab = 'dashboard';
let sidebarOpen = false;
let session = null; // {role:'admin'} or {role:'operator', operatorId}

const defaultSettings = {
  companyName: 'VP Offset Printers',
  address: 'Industrial Area, Bengaluru, Karnataka',
  phone: '',
  coatingRates: {
    'Gloss UV': 0.40, 'Drip-Off': 0.65, 'Matte UV': 0.40, 'High Gloss UV': 0.40,
    'Spot UV': 0.65, 'Textured UV': 0.65, 'Soft Touch UV': 0.65, 'Raised / 3D UV': 0.65,
    'Flood UV': 0.40, 'Selective / Partial UV': 0.65, 'Other': 0.40
  },
  defaultWorkingDays: 30,
  adminPin: '1234'
};
const COATING_TYPES = ['Gloss UV','Drip-Off','Matte UV','High Gloss UV','Spot UV','Textured UV','Soft Touch UV','Raised / 3D UV','Flood UV','Selective / Partial UV','Other'];
const ATT_STATUSES = ['P','H','A','L'];
const ATT_LABELS = {P:'Present',H:'Half-day',A:'Absent',L:'Leave'};

/* ============================================================
   HELPERS
============================================================ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function n(v){ return Number(v)||0; }
function fmtMoney(v){ v=Number(v)||0; return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thisMonth(){ return todayISO().slice(0,7); }
function monthLabel(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
function daysInMonth(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- UV coating price calculator (verified) ----
   Per Sheet Cost = (L × W / 100) × Rate(paise/sq inch), giving rupees.
   Job Amount = Per Sheet Cost × Qty. */
function coatingRate(type){ if(!type) return 0; const r=DB.settings.coatingRates||{}; return Number(r[type]??0); }
function parseSize(str){ if(!str) return null; const m=String(str).match(/(\d*\.?\d+)\s*[x×X\*]\s*(\d*\.?\d+)/); if(!m) return null; return {L:Number(m[1]),W:Number(m[2])}; }
function calcPerSheetCost(L,W,rate){ return (Number(L)||0)*(Number(W)||0)/100*(Number(rate)||0); }
function calcCoatingAmount(L,W,qty,rate){ return calcPerSheetCost(L,W,rate)*(Number(qty)||0); }
function uvJobText(coatingType,L,W,rate){
  const type=coatingType||'UV';
  const descType = /\sUV$/i.test(type) ? `UV ${type.replace(/\sUV$/i,'')}` : type;
  return (L&&W) ? `${descType} Coating sheet size ${L} x ${W} Per sq inch ${rate} paise` : '';
}

/* ============================================================
   STORAGE — synced via Firebase Firestore (works on any device,
   no Claude account needed — just an internet connection)
============================================================ */
// ▼▼▼ PASTE YOUR OWN FIREBASE PROJECT CONFIG HERE (see setup guide) ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyDQTKGnFsEvgVjoO6ybICJiCyUxYVKhcMg",
  authDomain: "vp-offset-ops.firebaseapp.com",
  projectId: "vp-offset-ops",
  storageBucket: "vp-offset-ops.firebasestorage.app",
  messagingSenderId: "115497765079",
  appId: "1:115497765079:web:063b8e2dba5b5304288892"
};
// ▲▲▲ ------------------------------------------------------- ▲▲▲

let fbDb = null;      // Firestore instance, or null if not connected
let fbUnsubs = [];    // live-sync listeners
let googleProvider = null;

function normalizeSettings(){
  if(!DB.settings) DB.settings = {...defaultSettings};
  Object.keys(defaultSettings).forEach(k=>{ if(DB.settings[k]===undefined) DB.settings[k]=(typeof defaultSettings[k]==='object'?{...defaultSettings[k]}:defaultSettings[k]); });
  if(!DB.settings.coatingRates) DB.settings.coatingRates={...defaultSettings.coatingRates};
  for(const t of Object.keys(defaultSettings.coatingRates)) if(DB.settings.coatingRates[t]==null) DB.settings.coatingRates[t]=defaultSettings.coatingRates[t];
  for(const k of ['employees','attendance','salaries','priceCalcs','inventory','stockTx','jobLogs']) if(!Array.isArray(DB[k])) DB[k]=[];
}

async function loadDB(){
  fbDb = null;
  let connectError = '';
  try{
    if(firebaseConfig.apiKey==='YOUR_API_KEY') throw new Error('Firebase config not filled in yet');
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    googleProvider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInAnonymously(); // silent — no login screen shown until they choose Admin/Operator
    fbDb = firebase.firestore();
  }catch(e){
    console.error('Firebase init failed', e);
    connectError = (e && (e.code||e.message)) || 'unknown error';
    fbDb = null;
  }
  window.__connectError = connectError;

  if(!fbDb){
    // Not connected (bad/missing config, or offline). App still works,
    // but nothing will be saved or synced until this is resolved.
    DB = { settings:null, employees:[], attendance:[], salaries:[], priceCalcs:[], inventory:[], stockTx:[], jobLogs:[] };
    normalizeSettings();
    return;
  }

  // One live subscription per store doc: the first snapshot delivers the
  // current value (used below to finish loading), and every later snapshot
  // — including writes made from another device — updates DB and re-renders.
  const initialLoads = STORE_KEYS.map(key => new Promise(resolve=>{
    let resolved = false;
    const unsub = fbDb.collection('store').doc(key).onSnapshot(snap=>{
      const body = snap.exists ? snap.data() : null;
      if(key==='settings') DB.settings = body || null;
      else DB[key] = (body && Array.isArray(body.items)) ? body.items : [];
      if(!resolved){ resolved = true; resolve(); }
      else { normalizeSettings(); if(session) render(); } // remote update after initial load
    }, err=>{ console.error('sync error',key,err); if(!resolved){ resolved=true; resolve(); } });
    fbUnsubs.push(unsub);
  }));
  await Promise.all(initialLoads);
  normalizeSettings();
}

async function save(key){
  if(!fbDb){ toast('Not connected — check your internet connection and Firebase setup.'); return; }
  try{
    const body = key==='settings' ? DB.settings : {items: DB[key]};
    await fbDb.collection('store').doc(key).set(body);
  }catch(e){
    console.error('save failed',key,e);
    toast('Save failed: '+(e && (e.code||e.message) || 'unknown error'), 7000);
  }
}
function toast(msg,duration){ const t=document.createElement('div'); t.className='toast'; t.style.maxWidth='90vw'; t.style.wordBreak='break-word'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),duration||2400); }

/* ============================================================
   ATTENDANCE HELPERS
============================================================ */
function getAttendance(employeeId,date){ return DB.attendance.find(a=>a.employeeId===employeeId && a.date===date); }
async function setAttendance(employeeId,date,status){
  const ex = getAttendance(employeeId,date);
  if(!status){ if(ex){ DB.attendance=DB.attendance.filter(a=>a!==ex); await save('attendance'); } return; }
  if(ex){ ex.status=status; } else { DB.attendance.push({id:uid(),employeeId,date,status}); }
  await save('attendance');
}
function cycleStatus(current){
  const idx = ATT_STATUSES.indexOf(current);
  if(idx===-1) return ATT_STATUSES[0];
  if(idx===ATT_STATUSES.length-1) return null;
  return ATT_STATUSES[idx+1];
}
function attendanceSummary(employeeId,month){
  const recs = DB.attendance.filter(a=>a.employeeId===employeeId && a.date.slice(0,7)===month);
  const s={present:0,half:0,absent:0,leave:0,marked:recs.length};
  recs.forEach(a=>{ if(a.status==='P')s.present++; else if(a.status==='H')s.half++; else if(a.status==='A')s.absent++; else if(a.status==='L')s.leave++; });
  s.effective = s.present + s.half*0.5;
  s.daysInMonth = daysInMonth(month);
  return s;
}
function suggestedGross(emp,summary){
  if(!emp) return 0;
  if(emp.salaryType==='Daily'){ return summary.effective * n(emp.dailyWage); }
  const wd = n(emp.workingDaysPerMonth) || n(DB.settings.defaultWorkingDays) || 30;
  return (n(emp.monthlySalary)/wd) * summary.effective;
}

/* ============================================================
   INVENTORY HELPERS
============================================================ */
function stockRemaining(itemId){
  const item = DB.inventory.find(i=>i.id===itemId);
  if(!item) return 0;
  const txs = DB.stockTx.filter(t=>t.itemId===itemId);
  const inQty = txs.filter(t=>t.type==='in').reduce((s,t)=>s+n(t.qty),0);
  const outQty = txs.filter(t=>t.type==='out').reduce((s,t)=>s+n(t.qty),0);
  return n(item.openingStock) + inQty - outQty;
}

async function attemptOperatorGoogleLogin(){
  const err = document.getElementById('opLoginError'); if(err) err.textContent='';
  if(!googleProvider) return err.textContent='Not connected yet — please wait a moment and try again.';
  try{
    const result = await firebase.auth().signInWithPopup(googleProvider);
    const email = (result.user.email||'').toLowerCase();
    const emp = DB.employees.find(e=>e.active!==false && (e.googleEmail||'').toLowerCase()===email);
    if(!emp){
      await firebase.auth().signOut();
      await firebase.auth().signInAnonymously();
      if(err) err.textContent = `${email} isn't linked to an employee. Ask admin to add this email to your profile.`;
      return;
    }
    session = {role:'operator', operatorId:emp.id, googleEmail:email, googleName:result.user.displayName||'', googlePhoto:result.user.photoURL||''};
    currentTab='op_attendance';
    document.getElementById('app').style.cssText='';
    render();
  }catch(e){
    console.error('Google sign-in failed', e);
    if(err) err.textContent = e.code==='auth/popup-closed-by-user' ? 'Sign-in cancelled.' : 'Sign-in failed — please try again.';
  }
}
async function logout(){
  session=null; sidebarOpen=false;
  try{
    const u = firebase.auth().currentUser;
    if(u && !u.isAnonymous){ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); }
  }catch(e){ console.error('logout reset failed', e); }
  render();
}

function renderDashboard(){
  const activeEmp = DB.employees.filter(e=>e.active!==false);
  const today = todayISO();
  const presentToday = DB.attendance.filter(a=>a.date===today && (a.status==='P'||a.status==='H')).length;
  const markedToday = DB.attendance.filter(a=>a.date===today).length;
  const month = thisMonth();
  const netPayroll = DB.salaries.filter(s=>s.month===month).reduce((s,x)=>s+n(x.net),0);
  const pendingPay = DB.salaries.filter(s=>s.month===month && s.status!=='Paid').length;
  const calcThisMonth = DB.priceCalcs.filter(c=>(c.date||'').slice(0,7)===month).reduce((s,c)=>s+n(c.total),0);
  const lowStock = DB.inventory.filter(i=>stockRemaining(i.id) <= n(i.reorderLevel)).length;
  const notMarked = activeEmp.length - markedToday;
  const pendingLogs = DB.jobLogs.filter(l=>l.status==='Pending').length;

  const insights = [];
  if(activeEmp.length===0) insights.push({ic:'👋',text:'Add your first employee in Settings to start tracking attendance and salary.'});
  if(pendingLogs>0) insights.push({ic:'🧾',text:`${pendingLogs} operator job log(s) awaiting your review in Price Calculator.`});
  if(notMarked>0) insights.push({ic:'📋',text:`${notMarked} of ${activeEmp.length} active employee(s) not yet marked for today.`});
  if(pendingPay>0) insights.push({ic:'💰',text:`${pendingPay} salary record(s) pending payment for ${monthLabel(month)}.`});
  if(lowStock>0) insights.push({ic:'📦',text:`${lowStock} inventory item(s) at or below reorder level.`});
  const avgAtt = activeEmp.length ? Math.round((presentToday/activeEmp.length)*100) : 0;
  if(activeEmp.length>0) insights.push({ic:'📈',text:`Today's attendance: ${presentToday}/${activeEmp.length} present (${avgAtt}%).`});
  if(insights.length===0) insights.push({ic:'✅',text:'Everything looks up to date.'});

  // last 6 months payroll trend
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d.toISOString().slice(0,7)); }
  const trend = months.map(m=>DB.salaries.filter(s=>s.month===m).reduce((s,x)=>s+n(x.net),0));
  const maxTrend = Math.max(1,...trend);

  return `
  <div class="kpi-grid">
    <div class="kpi" style="--accent:var(--cyan)"><div class="label">Active Employees</div><div class="value">${activeEmp.length}</div><div class="hint">${presentToday} present today</div></div>
    <div class="kpi" style="--accent:var(--green)"><div class="label">Payroll — ${monthLabel(month)}</div><div class="value">${fmtMoney(netPayroll)}</div><div class="hint">${pendingPay} pending payment</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="label">Price Calcs — ${monthLabel(month)}</div><div class="value">${fmtMoney(calcThisMonth)}</div><div class="hint">${DB.priceCalcs.filter(c=>(c.date||'').slice(0,7)===month).length} calculation(s)</div></div>
    <div class="kpi" style="--accent:${lowStock>0?'var(--red)':'var(--green)'}"><div class="label">Low Stock Items</div><div class="value">${lowStock}</div><div class="hint">${DB.inventory.length} items tracked</div></div>
    <div class="kpi" style="--accent:${pendingLogs>0?'var(--magenta)':'var(--green)'}"><div class="label">Pending Job Logs</div><div class="value">${pendingLogs}</div><div class="hint">From operator submissions</div></div>
  </div>
  <div class="row c2" style="align-items:start;">
    <div class="panel">
      <h3>Smart Insights</h3>
      ${insights.map(i=>`<div class="insight"><span class="ic">${i.ic}</span><span>${i.text}</span></div>`).join('')}
    </div>
    <div class="panel">
      <h3>Payroll Trend — Last 6 Months</h3>
      <div class="mini-bars">
        ${months.map((m,i)=>`<div class="col"><div class="bar" style="height:${Math.max(3,(trend[i]/maxTrend)*80)}px" title="${fmtMoney(trend[i])}"></div><div class="lbl">${m.slice(5)}</div></div>`).join('')}
      </div>
      <div class="helptext">Net salary paid/recorded per month.</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Quick Actions</h3></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="goTo('attendance')">Mark Attendance</button>
      <button class="btn secondary" onclick="goTo('salary')">Record Salary</button>
      <button class="btn secondary" onclick="goTo('calculator')">New Price Calculation</button>
      <button class="btn secondary" onclick="goTo('inventory')">Stock In / Out</button>
    </div>
  </div>`;
}

function calculateCalcJob(j){
  const sz = parseSize(j.size), r = n(j.rate);
  j.description = sz ? uvJobText(j.coatingType,sz.L,sz.W,r) : '';
  j.unitRate = sz ? Number(calcPerSheetCost(sz.L,sz.W,r).toFixed(2)) : 0;
  j.amount = Number((n(j.quantity)*j.unitRate).toFixed(2));
  return j;
}
function newCalcJob(){ return {jobName:'',coatingType:COATING_TYPES[0],size:'',quantity:'',rate:coatingRate(COATING_TYPES[0])||0.30}; }
function pendingJobLogs(){ return DB.jobLogs.filter(l=>l.status==='Pending').sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }

    <div id="calcJobs"></div>
    <div style="text-align:right;font-size:16px;font-weight:600;margin:14px 0;">Total: <span id="calcTotalDisplay" class="mono">₹0.00</span></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button class="btn secondary" onclick="window._calcJobs=[newCalcJob()];window._finalizingLogIds=[];renderContent();">Clear</button>

  </div>

    <tbody>${allLogs.length?allLogs.map(l=>{const op=DB.employees.find(e=>e.id===l.operatorId);return `<tr><td>${fmtDate(l.date)}</td><td>${escapeHtml(op?op.name:'—')}</td><td>${escapeHtml(l.jobName)}</td><td>${escapeHtml(l.size)}</td><td class="num">${l.quantity}</td><td>${l.status==='Finalized'?'<span class="badge paid">Finalized</span>':'<span class="badge pending">Pending</span>'}</td><td><button class="btn danger small" onclick="rejectJobLog('${l.id}')">Delete</button></td></tr>`;}).join(''):`<tr class="empty-row"><td colspan="7">No job logs submitted yet.</td></tr>`}</tbody></table>

function renderCalcJobs(){
  const w = document.getElementById('calcJobs'); if(!w) return;
  w.innerHTML = window._calcJobs.map((j,i)=>{
    calculateCalcJob(j);
    return `<div class="panel" style="margin:0 0 10px;padding:12px;">
      <div style="display:flex;justify-content:space-between;"><b>Job ${i+1}</b>${window._calcJobs.length>1?`<button class="item-remove" onclick="removeCalcJob(${i})">×</button>`:''}</div>
      <div class="field"><label>Job Name</label><input value="${escapeHtml(j.jobName||'')}" placeholder="e.g. Catalogue Cover" oninput="updateCalcJob(${i},'jobName',this.value)"></div>
      <div class="row c3">
        <div class="field"><label>UV Coating Type</label><select onchange="updateCalcJob(${i},'coatingType',this.value)">${COATING_TYPES.map(t=>`<option ${j.coatingType===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Size (L × W in)</label><input value="${escapeHtml(j.size||'')}" placeholder="20x15" oninput="updateCalcJob(${i},'size',this.value)"></div>
        <div class="field"><label>Quantity (sheets)</label><input type="number" min="0" value="${j.quantity||''}" oninput="updateCalcJob(${i},'quantity',this.value)"></div>
      </div>
      <div class="row c3">
        <div class="field"><label>Rate (Paise / Sq Inch)</label><input type="number" min="0" step="0.01" value="${j.rate}" oninput="updateCalcJob(${i},'rate',this.value)"></div>
        <div class="field"><label>Rate / Sheet · Auto</label><input readonly value="${fmtMoney(j.unitRate)}"></div>
        <div class="field"><label>Amount · Auto</label><input readonly value="${fmtMoney(j.amount)}"></div>
      </div>
      <div class="helptext">${escapeHtml(j.description||'Enter size, quantity and rate to calculate.')}</div>
    </div>`;
  }).join('');
  const t = window._calcJobs.reduce((s,j)=>s+n(j.amount),0);
  const d = document.getElementById('calcTotalDisplay'); if(d) d.textContent=fmtMoney(t);
}
function updateCalcJob(i,f,v){
  const j=window._calcJobs[i]; if(!j) return;
  if(f==='coatingType'){ j[f]=v; if(!j._rateTouched) j.rate=coatingRate(v)||j.rate; }
  else if(f==='rate'){ j.rate=n(v); j._rateTouched=true; }
  else j[f]=(f==='quantity')?n(v):v;
  calculateCalcJob(j); renderCalcJobs();
}
function addCalcJob(){ window._calcJobs.push(newCalcJob()); renderCalcJobs(); }
function removeCalcJob(i){ window._calcJobs.splice(i,1); renderCalcJobs(); }
async function saveCalculation(){
  window._calcJobs.forEach(calculateCalcJob);
  const jobs = window._calcJobs.filter(j=>j.jobName||j.size||n(j.quantity));
  if(!jobs.length) return toast('Add at least one job with size and quantity');
  for(const j of jobs){
    if(!parseSize(j.size)) return toast('Enter a valid size such as 20x15 for every job');
    if(n(j.quantity)<=0) return toast('Quantity must be greater than zero for every job');
  }
  const total = jobs.reduce((s,j)=>s+n(j.amount),0);
  const calcId = uid();
  DB.priceCalcs.push({id:calcId,date:todayISO(),jobs:JSON.parse(JSON.stringify(jobs)),total,createdAt:new Date().toISOString()});
  await save('priceCalcs');
  if(window._finalizingLogIds && window._finalizingLogIds.length){
    DB.jobLogs.forEach(l=>{ if(window._finalizingLogIds.includes(l.id)){ l.status='Finalized'; l.calcId=calcId; } });
    await save('jobLogs');
    window._finalizingLogIds=[];
  }
  window._calcJobs=[newCalcJob()];
  toast('Calculation saved to history'); renderContent();
}
function finalizeJobLog(logId){
  const log = DB.jobLogs.find(l=>l.id===logId); if(!log) return;
  const job = newCalcJob(); job.jobName=log.jobName; job.size=log.size; job.quantity=log.quantity;
  calculateCalcJob(job);
  if(!window._calcJobs) window._calcJobs=[];
  if(window._calcJobs.length===1 && !window._calcJobs[0].jobName && !window._calcJobs[0].size && !n(window._calcJobs[0].quantity)) window._calcJobs[0]=job;
  else window._calcJobs.push(job);
  if(!window._finalizingLogIds) window._finalizingLogIds=[];
  window._finalizingLogIds.push(logId);
  toast('Job loaded below — set coating type & rate, then Save to History.');
  renderContent();
}

  else { DB.attendance.push({id:uid(),employeeId:emp.id,date:today,status:'P',checkIn:time,checkInBy:session.googleEmail||''}); }
  await save('attendance');
  toast('Punched in at '+fmtTime(time)); renderContent();

async function opPunchOut(){
  const emp=currentOperator(); if(!emp) return;

  const ex=getAttendance(emp.id,today);

  if(ex.checkOut) return toast('Already punched out today');

    <div class="panel-head"><h3>My Job Logs</h3></div>
    <table><thead><tr><th>Date</th><th>Job Name</th><th>Size</th><th class="num">Qty</th><th>Status</th><th></th></tr></thead>
    <tbody>${myLogs.length?myLogs.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${escapeHtml(l.jobName)}</td><td>${escapeHtml(l.size)}</td><td class="num">${l.quantity}</td><td>${l.status==='Finalized'?'<span class="badge paid">Finalized</span>':'<span class="badge pending">Pending review</span>'}</td><td>${l.status==='Pending'?`<button class="btn danger small" onclick="opDeleteJobLog('${l.id}')">Delete</button>`:''}</td></tr>`).join(''):`<tr class="empty-row"><td colspan="6">No job logs submitted yet.</td></tr>`}</tbody></table>
  </div>`;
}
async function opSubmitJobLog(){
  const emp = currentOperator(); if(!emp) return;
  const jobName = document.getElementById('jl_name').value.trim();
  const size = document.getElementById('jl_size').value.trim();
  const quantity = n(document.getElementById('jl_qty').value);
  const date = document.getElementById('jl_date').value || todayISO();
  if(!jobName) return toast('Enter a job name');
  if(!parseSize(size)) return toast('Enter a valid size such as 20x15');
  if(quantity<=0) return toast('Quantity must be greater than zero');
  DB.jobLogs.push({id:uid(),date,operatorId:emp.id,jobName,size,quantity,status:'Pending',createdAt:new Date().toISOString()});
  await save('jobLogs');
  toast('Job submitted for review'); renderContent();
}
async function opDeleteJobLog(id){
  const log = DB.jobLogs.find(l=>l.id===id);
  if(!log || log.status!=='Pending') return;
  if(!confirm('Delete this job log?')) return;
  DB.jobLogs=DB.jobLogs.filter(l=>l.id!==id); await save('jobLogs'); renderContent();
}

function renderOpChemical(){
  const emp = currentOperator();
  if(!emp) return `<div class="panel"><p class="helptext">Your employee record was not found. Please contact admin.</p></div>`;
  const items = [...DB.inventory].sort((a,b)=>a.name.localeCompare(b.name));
  const myTx = DB.stockTx.filter(t=>t.operatorId===emp.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
  if(!items.length) return `<div class="panel"><p class="helptext">No inventory items set up yet. Ask admin to add chemicals/materials in Inventory first.</p></div>`;
  return `
  <div class="panel">
    <h3>Log Chemical / Material Usage</h3>
    <p class="helptext">This records usage as stock-out and updates remaining quantity.</p>
    <div class="row c2">
      <div class="field"><label>Item</label><select id="cu_item">${items.map(i=>`<option value="${i.id}">${escapeHtml(i.name)} — ${stockRemaining(i.id)} ${escapeHtml(i.unit||'')} left</option>`).join('')}</select></div>
      <div class="field"><label>Quantity Used</label><input id="cu_qty" type="number" min="0"></div>
    </div>
    <div class="row c2">
      <div class="field"><label>Date</label><input id="cu_date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>Notes (optional)</label><input id="cu_notes" placeholder="e.g. Job — Catalogue Cover"></div>
    </div>
    <div style="text-align:right;"><button class="btn" onclick="opSubmitChemicalUsage()">Log Usage</button></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>My Recent Usage</h3></div>
    <table><thead><tr><th>Date</th><th>Item</th><th class="num">Qty Used</th><th>Notes</th></tr></thead>
    <tbody>${myTx.length?myTx.map(t=>{const it=DB.inventory.find(x=>x.id===t.itemId);return `<tr><td>${fmtDate(t.date)}</td><td>${escapeHtml(it?it.name:'—')}</td><td class="num">${t.qty}</td><td>${escapeHtml(t.notes||'—')}</td></tr>`;}).join(''):`<tr class="empty-row"><td colspan="4">No usage logged yet.</td></tr>`}</tbody></table>
  </div>`;
}
async function opSubmitChemicalUsage(){
  const emp = currentOperator(); if(!emp) return;
  const itemId = document.getElementById('cu_item').value;
  const qty = n(document.getElementById('cu_qty').value);
  const date = document.getElementById('cu_date').value || todayISO();
  const notes = document.getElementById('cu_notes').value.trim();
  if(qty<=0) return toast('Quantity must be greater than zero');
  if(stockRemaining(itemId)<qty) if(!confirm('This will make stock negative. Continue?')) return;
  DB.stockTx.push({id:uid(),itemId,type:'out',qty,date,notes,operatorId:emp.id,createdAt:new Date().toISOString()});
  await save('stockTx');
  toast('Usage logged'); renderContent();
}

/* ============================================================
   SETTINGS
============================================================ */
function renderSettings(){
  const s = DB.settings;
  const emp = [...DB.employees].sort((a,b)=>a.name.localeCompare(b.name));
  return `
  <div class="panel">
    <div class="panel-head"><h3>Company Details</h3></div>
    <div class="row c2"><div class="field"><label>Company Name</label><input id="st_name" value="${escapeHtml(s.companyName)}"></div><div class="field"><label>Phone</label><input id="st_phone" value="${escapeHtml(s.phone||'')}"></div></div>
    <div class="field"><label>Address</label><input id="st_address" value="${escapeHtml(s.address||'')}"></div>
    <div class="row c2">
      <div class="field"><label>Default Working Days / Month</label><input id="st_wd" type="number" value="${s.defaultWorkingDays||30}"></div>
      <div class="field"><label>Admin Login PIN</label><input id="st_pin" value="${escapeHtml(String(s.adminPin||'1234'))}"></div>
    </div>
    <div style="text-align:right;"><button class="btn" onclick="saveCompanySettings()">Save Company Details</button></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Employees</h3><button class="btn" onclick="openEmployeeModal()">+ Add Employee</button></div>
    <table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Salary Type</th><th class="num">Rate</th><th>Status</th><th></th></tr></thead>
    <tbody>${emp.length?emp.map(e=>`<tr><td><b>${escapeHtml(e.name)}</b></td><td>${escapeHtml(e.role||'—')}</td><td>${escapeHtml(e.phone||'—')}</td><td>${e.salaryType}</td><td class="num">${e.salaryType==='Daily'?fmtMoney(e.dailyWage)+'/day':fmtMoney(e.monthlySalary)+'/mo'}</td><td>${e.active===false?'<span class="badge inactive">Inactive</span>':'<span class="badge ok">Active</span>'}</td><td><button class="btn secondary small" onclick='openEmployeeModal(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn danger small" onclick="deleteEmployee('${e.id}')">Delete</button></td></tr>`).join(''):`<tr class="empty-row"><td colspan="7">No employees yet.</td></tr>`}</tbody></table>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>UV Coating Rates (default ₹ paise/sq inch)</h3><button class="btn secondary small" onclick="addCoatingType()">+ Add Type</button></div>
    <table><thead><tr><th>Coating Type</th><th class="num">Default Rate</th><th></th></tr></thead>
    <tbody>${Object.keys(s.coatingRates).map(t=>`<tr><td><input value="${escapeHtml(t)}" disabled></td><td class="num"><input type="number" step="0.01" value="${s.coatingRates[t]}" onchange="updateCoatingRate('${t.replace(/'/g,"\\'")}',this.value)" style="max-width:120px;margin-left:auto;"></td><td><button class="btn danger small" onclick="removeCoatingType('${t.replace(/'/g,"\\'")}')">Remove</button></td></tr>`).join('')}</tbody></table>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Backup</h3></div>
    <div style="display:flex;gap:10px;"><button class="btn secondary" onclick="exportData()">⬇ Export Backup (JSON)</button><button class="btn secondary" onclick="openImportBackup()">⬆ Restore Backup</button></div>
  </div>`;
}
async function saveCompanySettings(){
  DB.settings.companyName=document.getElementById('st_name').value.trim()||'VP Offset Printers';
  DB.settings.phone=document.getElementById('st_phone').value.trim();
  DB.settings.address=document.getElementById('st_address').value.trim();
  DB.settings.defaultWorkingDays=n(document.getElementById('st_wd').value)||30;
  DB.settings.adminPin=document.getElementById('st_pin').value.trim()||'1234';
  await save('settings'); toast('Company details saved'); render();
}
function openEmployeeModal(existing){
  const e = existing || {id:uid(),name:'',role:'Operator',phone:'',salaryType:'Monthly',monthlySalary:0,dailyWage:0,workingDaysPerMonth:DB.settings.defaultWorkingDays||30,active:true};
  showModal(`<h3>${existing?'Edit':'Add'} Employee</h3>
    <div class="row c2"><div class="field"><label>Name</label><input id="em_name" value="${escapeHtml(e.name)}"></div><div class="field"><label>Role</label><input id="em_role" value="${escapeHtml(e.role||'')}"></div></div>
    <div class="row c2"><div class="field"><label>Phone</label><input id="em_phone" value="${escapeHtml(e.phone||'')}"></div><div class="field"><label>Salary Type</label><select id="em_type" onchange="toggleSalaryFields()"><option value="Monthly" ${e.salaryType==='Monthly'?'selected':''}>Monthly</option><option value="Daily" ${e.salaryType==='Daily'?'selected':''}>Daily wage</option></select></div></div>
    <div class="field"><label>Google Email (for operator sign-in)</label><input id="em_gmail" type="email" placeholder="name@gmail.com" value="${escapeHtml(e.googleEmail||'')}"></div>
    <p class="helptext" style="margin-top:-6px;">The employee will sign in with this exact Google account to punch in/out — this stops anyone punching in on someone else's behalf.</p>
    <div class="row c2">
      <div class="field" id="em_monthlyWrap"><label>Monthly Salary</label><input id="em_monthly" type="number" value="${e.monthlySalary||0}"></div>
      <div class="field" id="em_dailyWrap"><label>Daily Wage</label><input id="em_daily" type="number" value="${e.dailyWage||0}"></div>
    </div>
    <div class="field" id="em_wdWrap"><label>Working Days / Month (for monthly salary calc)</label><input id="em_wd" type="number" value="${e.workingDaysPerMonth||DB.settings.defaultWorkingDays||30}" style="max-width:160px;"></div>
    <div class="field"><label>Status</label><select id="em_active"><option value="true" ${e.active!==false?'selected':''}>Active</option><option value="false" ${e.active===false?'selected':''}>Inactive</option></select></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEmployee('${e.id}',${!existing})">Save Employee</button></div>`);
  toggleSalaryFields();
}
function toggleSalaryFields(){
  const t = document.getElementById('em_type')?.value;
  const mw=document.getElementById('em_monthlyWrap'), dw=document.getElementById('em_dailyWrap'), wd=document.getElementById('em_wdWrap');
  if(!mw) return;
  if(t==='Daily'){ mw.style.display='none'; dw.style.display='block'; wd.style.display='none'; }
  else { mw.style.display='block'; dw.style.display='none'; wd.style.display='block'; }
}
async function saveEmployee(id,isNew){
  const name=document.getElementById('em_name').value.trim();
  if(!name) return toast('Employee name is required');
  const googleEmail=document.getElementById('em_gmail').value.trim().toLowerCase();
  if(googleEmail && DB.employees.some(x=>x.id!==id && (x.googleEmail||'').toLowerCase()===googleEmail)) return toast('That Google email is already linked to another employee');
  const data={id,name,role:document.getElementById('em_role').value.trim(),phone:document.getElementById('em_phone').value.trim(),googleEmail,
    salaryType:document.getElementById('em_type').value,monthlySalary:n(document.getElementById('em_monthly').value),
    dailyWage:n(document.getElementById('em_daily').value),workingDaysPerMonth:n(document.getElementById('em_wd').value)||30,
    active:document.getElementById('em_active').value==='true'};
  if(isNew) DB.employees.push(data); else { const idx=DB.employees.findIndex(x=>x.id===id); if(idx>=0) DB.employees[idx]=data; }
  await save('employees'); closeModal(); toast('Employee saved'); render();
}
async function deleteEmployee(id){ if(!confirm('Delete this employee? Attendance and salary history will remain but be orphaned.')) return; DB.employees=DB.employees.filter(x=>x.id!==id); await save('employees'); render(); }
async function addCoatingType(){
  const name = prompt('New coating type name:'); if(!name) return;
  if(DB.settings.coatingRates[name]!=null) return toast('Type already exists');
  DB.settings.coatingRates[name]=0.30; await save('settings'); render();
}
async function updateCoatingRate(type,val){ DB.settings.coatingRates[type]=n(val); await save('settings'); }
async function removeCoatingType(type){ if(!confirm(`Remove "${type}"?`)) return; delete DB.settings.coatingRates[type]; await save('settings'); render(); }
function exportData(){
  const blob=new Blob([JSON.stringify({...DB,exportedAt:new Date().toISOString(),appVersion:'VP-Ops-Lite'},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='vp-ops-backup-'+todayISO()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function openImportBackup(){
  showModal(`<h3>Restore Backup</h3><p class="helptext">This replaces current data. Export a backup first.</p><input id="backupFile" type="file" accept="application/json"><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="restoreBackup()">Restore</button></div>`);
}
async function restoreBackup(){
  const f=document.getElementById('backupFile').files[0]; if(!f) return toast('Choose a backup file');
  try{
    const d=JSON.parse(await f.text());
    if(!d.settings) throw Error('Invalid backup');
    DB=d;
    for(const k of STORE_KEYS) if(k!=='settings' && !Array.isArray(DB[k])) DB[k]=[];
    await Promise.all(STORE_KEYS.map(save));
    closeModal(); toast('Backup restored'); render();
  }catch(e){ toast('Invalid backup file'); }
}

/* ============================================================
   MODAL
============================================================ */
function showModal(html){
  const back=document.createElement('div'); back.className='modal-backdrop'; back.id='modalBackdrop';
  back.innerHTML=`<div class="modal">${html}</div>`;
  back.addEventListener('mousedown',e=>{ if(e.target===back) closeModal(); });
  document.body.appendChild(back);
}
function closeModal(){ document.getElementById('modalBackdrop')?.remove(); }

/* ============================================================
   INIT
============================================================ */
(async function init(){
  await loadDB();
  render();
})();
</script>
</body>
</html>
